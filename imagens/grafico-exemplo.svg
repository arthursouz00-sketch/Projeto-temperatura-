<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Participação por dia na variação de temperatura</title>
  <desc id="descricao">Gráfico de rosca de exemplo com temperaturas entre 18 e 30 graus Celsius. A média da semana é 24 graus.</desc>
  <rect width="960" height="500" rx="24" fill="#f3f7fd"/>
  <rect x="20" y="20" width="920" height="460" rx="20" fill="#fff" stroke="#e5eaf2"/>
  <text x="54" y="76" fill="#143b76" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Participação por dia</text>
  <text x="54" y="106" fill="#536174" font-family="Segoe UI, Arial, sans-serif" font-size="15">Exemplo de variação semanal · temperaturas em °C</text>

  <circle cx="290" cy="292" r="112" fill="none" stroke="#edf1f7" stroke-width="54"/>
  <g transform="rotate(-90 290 292)" fill="none" stroke-width="54">
    <circle cx="290" cy="292" r="112" stroke="#e05d44" stroke-dasharray="33.51 670.21" stroke-dashoffset="0"/>
    <circle cx="290" cy="292" r="112" stroke="#7a55c7" stroke-dasharray="67.02 636.70" stroke-dashoffset="-33.51"/>
    <circle cx="290" cy="292" r="112" stroke="#138a72" stroke-dasharray="100.53 603.19" stroke-dashoffset="-100.53"/>
    <circle cx="290" cy="292" r="112" stroke="#d18a13" stroke-dasharray="134.04 569.68" stroke-dashoffset="-201.06"/>
    <circle cx="290" cy="292" r="112" stroke="#ce4f8b" stroke-dasharray="167.55 536.17" stroke-dashoffset="-335.10"/>
    <circle cx="290" cy="292" r="112" stroke="#47718f" stroke-dasharray="201.06 502.66" stroke-dashoffset="-502.65"/>
  </g>
  <circle cx="290" cy="292" r="77" fill="#fff"/>
  <text x="290" y="274" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">MÉDIA</text>
  <text x="290" y="305" text-anchor="middle" fill="#173d73" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">24 °C</text>
  <text x="290" y="330" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">7 DIAS NA SEMANA</text>

  <text x="560" y="174" fill="#34445c" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Temperaturas de exemplo</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <circle cx="572" cy="215" r="7" fill="#1769d2"/>
    <text x="592" y="220" fill="#34445c">Segunda-feira</text><text x="855" y="220" text-anchor="end" fill="#536174">18 °C · 0%</text>
    <circle cx="572" cy="250" r="7" fill="#e05d44"/>
    <text x="592" y="255" fill="#34445c">Terça-feira</text><text x="855" y="255" text-anchor="end" fill="#536174">20 °C · 4,8%</text>
    <circle cx="572" cy="285" r="7" fill="#7a55c7"/>
    <text x="592" y="290" fill="#34445c">Quarta-feira</text><text x="855" y="290" text-anchor="end" fill="#536174">22 °C · 9,5%</text>
    <circle cx="572" cy="320" r="7" fill="#138a72"/>
    <text x="592" y="325" fill="#34445c">Quinta-feira</text><text x="855" y="325" text-anchor="end" fill="#536174">24 °C · 14,3%</text>
    <circle cx="572" cy="355" r="7" fill="#d18a13"/>
    <text x="592" y="360" fill="#34445c">Sexta-feira</text><text x="855" y="360" text-anchor="end" fill="#536174">26 °C · 19,0%</text>
    <circle cx="572" cy="390" r="7" fill="#ce4f8b"/>
    <text x="592" y="395" fill="#34445c">Sábado</text><text x="855" y="395" text-anchor="end" fill="#536174">28 °C · 23,8%</text>
    <circle cx="572" cy="425" r="7" fill="#47718f"/>
    <text x="592" y="430" fill="#34445c">Domingo</text><text x="855" y="430" text-anchor="end" fill="#536174">30 °C · 28,6%</text>
  </g>
</svg>
